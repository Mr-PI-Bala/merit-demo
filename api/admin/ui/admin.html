<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font:16px system-ui;max-width:60rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:.5rem 0}input{padding:.4rem}table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{border:1px solid #ddd;padding:.4rem;text-align:left}.status{color:#555}</style></head>
<body><main><h1>Operator admin</h1><p class="status">Authenticated administration.</p><h2>Plus pricing</h2>
<form id="pricing-form"><label>Monthly USD <input type="number" step=".01" id="monthly" required></label><label>Weekly equivalent USD <input type="number" step=".01" id="weekly"></label><label>6-month discount % <input type="number" id="disc6" value="20"></label><label>Annual discount % <input type="number" id="disc12" value="50"></label><button type="submit">Save pricing</button> <span id="save-msg"></span></form>
<h3>Approved price points</h3><table><thead><tr><th>Label</th><th>Monthly USD</th><th></th></tr></thead><tbody id="price-points"></tbody></table><p><input id="pp-label" placeholder="Label"><input id="pp-usd" type="number" step=".01" placeholder="USD"><button type="button" id="add-pp">Add point</button></p><p class="status">Authenticated changes are saved through the protected operator API.</p></main>
<script>const auth=()=>({Authorization:`Bearer ${sessionStorage.getItem('merit-demo-admin-key')||''}`});let approved=[];async function load(){const r=await fetch('/api/admin/pricing',{headers:auth()});if(!r.ok){location.href='/admin/';return}const d=await r.json();const p=d.override?.config?.default||d.plus_sku?.default||{};monthly.value=p.monthly_billed_usd??10.79;weekly.value=p.weekly_rate_usd??2.49;approved=d.override?.config?.approved_price_points||[];render()}function render(){pricePoints.innerHTML='';approved.forEach((p,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${p.label}</td><td>${p.monthly_usd}</td><td><button type="button">Remove</button></td>`;tr.querySelector('button').onclick=()=>{approved.splice(i,1);render()};pricePoints.appendChild(tr)})}addPp.onclick=()=>{const label=ppLabel.value.trim(),monthly_usd=parseFloat(ppUsd.value);if(!label||!monthly_usd)return;approved.push({label,monthly_usd});ppLabel.value='';ppUsd.value='';render()};pricingForm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/pricing',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({default:{monthly_billed_usd:parseFloat(monthly.value),weekly_rate_usd:parseFloat(weekly.value),billing_options:[{id:'monthly',discount_percent:0},{id:'six_month',discount_percent:parseInt(disc6.value,10)},{id:'annual',discount_percent:parseInt(disc12.value,10)}]},approved_price_points:approved})});saveMsg.textContent=r.ok?'Saved.':'Save failed.'};load();</script></body></html>
