<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin access</title>
<style>body{font:16px system-ui;max-width:42rem;margin:4rem auto;padding:0 1rem;background:#081524;color:#eef}input,button{font:inherit;padding:.6rem;border-radius:.4rem}input{width:100%;box-sizing:border-box;margin:.75rem 0}button{cursor:pointer}</style></head>
<body><main><h1>Admin access</h1><p>Admin key is required to access this page.</p><input id="admin-key" type="password" autocomplete="off" placeholder="Admin key"><button id="continue">Continue</button><p id="error" role="status"></p></main>
<script>document.getElementById('continue').onclick=async()=>{const key=document.getElementById('admin-key').value;const r=await fetch('/api/admin/ui',{headers:{Authorization:`Bearer ${key}`}});if(r.ok){sessionStorage.setItem('merit-demo-admin-key',key);document.open();document.write(await r.text());document.close();}else{document.getElementById('error').textContent='Admin key is required to access this page.';}};</script></body></html>
